services:
  - type: web
    name: stocksense-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: singapore # Closest low-latency region to NSE/BSE Indian markets
    plan: starter     # Recommended: starter/standard for TensorFlow runtime (512MB-1GB RAM)
    healthCheckPath: /api/system/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: MARKET_TIMEZONE
        value: Asia/Kolkata
      - key: QUOTE_CACHE_TTL
        value: "20"
      - key: HISTORY_CACHE_TTL
        value: "180"
      - key: PREDICTION_CACHE_TTL
        value: "600"
